<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>House Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="House Hub">
<meta name="theme-color" content="#10141c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="home" class="screen flex col">
  <div class="home-top flex between center">
    <div class="top-left">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="weather" id="weather" data-action="open" data-app="weather"></div>
    <div class="home-title flex center">
      <button class="gear" data-action="open" data-app="settings" aria-label="Settings">⚙️</button>
    </div>
  </div>

  <div class="home-grid grow flex col">
    <div class="grid-row flex">
      <section class="panel-card p-agenda flex col" data-action="open" data-app="calendar">
        <div class="pc-title flex between center"><span>Agenda</span><span class="pc-link">Calendar ›</span></div>
        <div class="pc-body grow agenda-split flex col">
          <div class="ag-half grow flex col"><div class="ag-head">Today</div><div class="ag-scroll grow" id="agenda"></div></div>
          <div class="ag-half grow flex col"><div class="ag-head" id="ag-tom-head">Tomorrow</div><div class="ag-scroll grow" id="agenda-tom"></div></div>
        </div>
      </section>
      <section class="panel-card p-todos flex col">
        <div class="pc-title flex between center"><span>To-dos</span></div>
        <div class="pc-body grow flex todo-cols" id="home-todos"></div>
      </section>
    </div>
    <div class="grid-row flex">
      <section class="panel-card p-cams flex col" data-action="util-snap">
        <div class="pc-title flex between center"><span>Cameras</span><span class="pc-link live-link">● Live view ›</span></div>
        <div class="pc-body grow cam-tiles flex">
          <div class="cam-thumb grow"><img id="home-snap" alt=""><div class="ct-empty" id="home-snap-empty">🔔</div><div class="ct-name">Doorbell</div></div>
          <div class="cam-thumb grow"><div class="ct-empty" id="home-garage-empty">🚗</div><div class="ct-name" id="home-garage-name">Garage</div></div>
        </div>
      </section>
      <section class="panel-card p-groc flex col">
        <button class="pc-title flex between center groc-title" data-action="open" data-app="groceries"><span>Groceries <span class="ug-count" id="groc-count"></span></span><span class="pc-link">Open ›</span></button>
        <div class="pc-body grow ug-list" id="home-groc"></div>
        <form class="ug-add flex" data-form="home-groc-add"><input class="field grow" id="home-groc-input" placeholder="Add an item…" autocomplete="off"><button class="btn primary small" type="submit">Add</button></form>
      </section>
    </div>
  </div>

</div>

<div id="panel" class="screen flex col hidden">
  <div class="panel-head flex center between">
    <button class="back" data-action="home">‹ Home</button>
    <h2 id="panel-title" class="grow"></h2>
    <div class="head-right" id="panel-actions"></div>
  </div>
  <div class="panel-body grow" id="panel-body"></div>
</div>

<div id="modal-root"></div>
<div id="dimmer" class="hidden"><div class="clock" id="dim-clock"></div></div>

<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
