<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>House Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="House Hub">
<meta name="theme-color" content="#10141c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="home" class="screen flex col">
  <div class="home-top flex between center">
    <div class="top-left">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="weather" id="weather" data-action="open" data-app="weather"></div>
    <div class="home-title flex center">
      <div><h1 id="title">Our Home</h1><div class="sync" id="sync"></div></div>
      <button class="gear" data-action="open" data-app="settings" aria-label="Settings">⚙️</button>
    </div>
  </div>

  <div class="home-grid grow flex col">
    <div class="grid-row flex">
      <section class="panel-card p-agenda flex col" data-action="open" data-app="calendar">
        <div class="pc-title flex between center"><span>Today’s agenda</span><span class="pc-link">Calendar ›</span></div>
        <div class="pc-body grow" id="agenda"></div>
      </section>
      <section class="panel-card p-todos flex col">
        <div class="pc-title flex between center"><span>To-dos</span><span class="pc-link" data-action="open" data-app="todo">Full list ›</span></div>
        <div class="pc-body grow flex todo-cols" id="home-todos"></div>
      </section>
    </div>
    <div class="grid-row flex">
      <section class="panel-card p-notes flex col">
        <div class="pc-title flex between center"><span>Pinned family notes</span><button class="btn small" data-action="add-note">+ Note</button></div>
        <div class="pc-body grow" id="notes"></div>
      </section>
      <section class="panel-card p-utils flex col">
        <div class="pc-title">Quick utilities</div>
        <div class="pc-body grow utils flex">
          <div class="util-groc flex col">
            <div class="ug-head flex between center"><span class="util-label">🛒 Grocery list</span><span class="pc-link" data-action="open" data-app="groceries">Open ›</span></div>
            <div class="ug-list grow" id="home-groc"></div>
            <form class="ug-add flex" data-form="home-groc-add"><input class="field grow" id="home-groc-input" placeholder="Add an item…" autocomplete="off"><button class="btn primary small" type="submit">Add</button></form>
          </div>
          <button class="util util-snap" data-action="util-snap"><span class="util-icon">📷</span><span class="util-label">Camera snap</span><span class="util-sub muted small" id="snap-sub"></span></button>
        </div>
      </section>
    </div>
  </div>

  <div class="dock flex">
    <button class="app-btn" data-action="open" data-app="calendar"><div class="tile img"><img src="icons/calendar.svg" alt=""><span class="badge hidden" id="badge-calendar"></span></div><div class="label">Calendar</div></button>
    <button class="app-btn" data-action="open" data-app="groceries"><div class="tile img"><img src="icons/groceries.svg" alt=""><span class="badge hidden" id="badge-groceries"></span></div><div class="label">Groceries</div></button>
    <button class="app-btn" data-action="open" data-app="cameras"><div class="tile img"><img src="icons/cameras.svg" alt=""></div><div class="label">Cameras</div></button>
    <button class="app-btn" data-action="open" data-app="settings"><div class="tile img"><img src="icons/settings.svg" alt=""></div><div class="label">Settings</div></button>
  </div>
</div>

<div id="panel" class="screen flex col hidden">
  <div class="panel-head flex center between">
    <button class="back" data-action="home">‹ Home</button>
    <h2 id="panel-title" class="grow"></h2>
    <div class="head-right" id="panel-actions"></div>
  </div>
  <div class="panel-body grow" id="panel-body"></div>
</div>

<div id="modal-root"></div>
<div id="dimmer" class="hidden"><div class="clock" id="dim-clock"></div></div>

<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
